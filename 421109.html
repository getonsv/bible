 <head>

  <title>Verifying Sealing Exam - 421109</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow-y: auto;
    }

    * {
      box-sizing: border-box;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .title {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #e0e7ff;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .control-button {
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }

    .check-btn {
      background: #10b981;
      color: #ffffff;
    }

    .check-btn:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    .show-btn {
      background: #f59e0b;
      color: #ffffff;
    }

    .show-btn:hover {
      background: #d97706;
      transform: translateY(-2px);
    }

    .reset-btn {
      background: #ef4444;
      color: #ffffff;
    }

    .reset-btn:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    .question-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .question-number {
      font-size: 1.1rem;
      font-weight: bold;
      color: #667eea;
    }

    .question-points {
      font-size: 0.9rem;
      color: #6b7280;
      font-style: italic;
    }

    .question-text {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #1f2937;
      margin-bottom: 1.5rem;
    }

    .answer-section {
      background: #f9fafb;
      padding: 1.5rem;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
    }

    .answer-subsection {
      margin-bottom: 1.25rem;
    }

    .answer-subsection:last-child {
      margin-bottom: 0;
    }

    .subsection-label {
      font-size: 1rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 0.5rem;
    }

    .answer-line {
      margin-bottom: 1rem;
      line-height: 1.8;
      font-size: 1rem;
    }

    .answer-textarea {
      width: 100%;
      padding: 1rem;
      border: 2px solid #667eea;
      border-radius: 8px;
      background: #ffffff;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      line-height: 1.6;
      transition: all 0.3s;
      resize: vertical;
      min-height: 100px;
    }

    .answer-textarea:focus {
      outline: none;
      border-color: #764ba2;
      background: #fef3c7;
    }

    .answer-textarea.correct {
      border-color: #10b981;
      background: #d1fae5;
    }

    .answer-textarea.incorrect {
      border-color: #ef4444;
      background: #fee2e2;
    }

    .answer-textarea.revealed {
      border-color: #f59e0b;
      background: #fef3c7;
      color: #d97706;
      font-weight: bold;
    }

    .feedback-message {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .score-display {
      background: #ffffff;
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      display: none;
    }

    .score-display.show {
      display: block;
    }

    .score-text {
      font-size: 1.5rem;
      font-weight: bold;
      color: #667eea;
    }

    .score-details {
      font-size: 1rem;
      color: #6b7280;
      margin-top: 0.5rem;
    }

    .password-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100%;
      padding: 2rem;
    }

    .password-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }

    .password-title {
      font-size: 2rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 0.5rem;
    }

    .password-subtitle {
      font-size: 1rem;
      color: #6b7280;
      margin-bottom: 2rem;
    }

    .password-input {
      width: 100%;
      padding: 1rem;
      border: 2px solid #667eea;
      border-radius: 12px;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      margin-bottom: 1rem;
      transition: all 0.3s;
    }

    .password-input:focus {
      outline: none;
      border-color: #764ba2;
      background: #fef3c7;
    }

    .password-button {
      width: 100%;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
      background: #667eea;
      color: #ffffff;
    }

    .password-button:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    .password-error {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #ef4444;
      background: #fee2e2;
      display: none;
    }

    .password-error.show {
      display: block;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }

      .title {
        font-size: 1.8rem;
      }

      .question-card {
        padding: 1.5rem;
      }

      .answer-textarea {
        font-size: 0.9rem;
        padding: 0.75rem;
      }

      .controls {
        flex-direction: column;
      }

      .control-button {
        width: 100%;
      }
    }
  </style>

 <body>
  <div class="password-screen" id="password-screen">
   <div class="password-card">
    <h1 class="password-title">🔒 Quiz Access</h1>
    <p class="password-subtitle">Enter password to access the quiz</p>
    <form id="password-form"><input type="password" id="password-input" class="password-input" placeholder="Enter password" autocomplete="off"> <button type="submit" class="password-button">Unlock</button>
    </form>
    <div class="password-error" id="password-error"></div>
   </div>
  </div>
  <div class="container" id="quiz-container" style="display: none;">
   <header class="header">
    <h1 class="title" id="quiz-title">Revelation Fill-in-the-Blanks Quiz</h1>
    <p class="subtitle">Fill in the missing words and check your answers</p>
   </header>
   <div class="controls"><button class="control-button check-btn" id="check-btn">Check Answers</button> <button class="control-button show-btn" id="show-btn">Show All Answers</button> <button class="control-button reset-btn" id="reset-btn">Reset Quiz</button>
   </div>
   <div class="score-display" id="score-display">
    <div class="score-text" id="score-text"></div>
    <div class="score-details" id="score-details"></div>
   </div>
   <main id="questions-container"></main>
  </div>
  <script>
    const CORRECT_PASSWORD = '#pink42';

    document.getElementById('password-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const passwordInput = document.getElementById('password-input');
      const passwordError = document.getElementById('password-error');
      const enteredPassword = passwordInput.value;

      if (enteredPassword === CORRECT_PASSWORD) {
        document.getElementById('password-screen').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        renderQuestions();
      } else {
        passwordError.textContent = '❌ Incorrect password. Please try again.';
        passwordError.classList.add('show');
        passwordInput.value = '';
        passwordInput.focus();
        
        setTimeout(() => {
          passwordError.classList.remove('show');
        }, 3000);
      }
    });

    const questions = [
      {
        number: 1,
        question: "① What is a believer's destination? ② When is eternal life fulfilled?",
        points: "[10 points (5 points per sub-question)]",
        sections: [
          { label: "①", answer: "The world of the paradise where there is eternal life in Rv 21" },
          { label: "②", answer: "When God comes with the kingdom of heaven and the food of eternal life" }
        ]
      },
      {
        number: 2,
        question: "① What is the very first thing Jesus says when he returns? ② Who is it? ③ What is it?",
        points: "[12 points (4 points per sub-question)]",
        sections: [
          { label: "①", answer: "To overcome" },
          { label: "②", answer: "Someone who must be fought (an enemy)" },
          { label: "③", answer: "A spiritual war" }
        ]
      },
      {
        number: 3,
        question: "In the Bible, there is ① food that God's pastor gives and ② food that the devil's pastor gives. Write what these two kinds of food are in Revelation, including their references.",
        points: "[10 points (5 points per sub-question)]",
        sections: [
          { label: "① The food God's pastor gives (3 references):", answer: "Rv 2:17, the hidden manna; Rv 10, the revealed word; Rv 22, the fruit of the tree of life" },
          { label: "② The food the devil's pastor gives (2 references):", answer: "Rv 17:2, Rv 18:3, the wine of adulteries" }
        ]
      },
      {
        number: 4,
        question: "What does it mean where it says in Rv 3:12 that the name of God, the name of the Holy City, New Jerusalem, and Jesus' new name will be written on the one who overcomes?",
        points: "[10 points]",
        sections: [
          { label: "", answer: "That God, the kingdom of heaven, and Jesus come to the one who overcomes" }
        ]
      },
      {
        number: 5,
        question: "What must people believe in when Revelation is fulfilled?",
        points: "[10 points]",
        sections: [
          { label: "", answer: "The actual entities that have been fulfilled according to the word" }
        ]
      },
      {
        number: 6,
        question: "What proves that the seals have been removed from Revelation?",
        points: "[10 points]",
        sections: [
          { label: "", answer: "The actual entities recorded inside of it appearing" }
        ]
      },
      {
        number: 7,
        question: "Jesus was the Savior and was from Nazareth. What is a Korean saying/proverb related to this?",
        points: "[10 points]",
        sections: [
          { label: "", answer: "There is a royal emissary hidden (disguised) among beggars." }
        ]
      },
      {
        number: 8,
        question: "According to the four gospels, when are the prophecies in the New Covenant, Revelation, fulfilled? Include a verse reference.",
        points: "[10 points]",
        sections: [
          { label: "", answer: "After the gospel of the kingdom of heaven (the prophecies) is preached in the whole world, Mt 24:14" }
        ]
      },
      {
        number: 9,
        question: "Rv 15:4-5 says that all nations will come to worship at the temple of the tabernacle of the testimony. Rv 2-3 say that something is given that is the same as this. What is given that is the same as this?",
        points: "[10 points]",
        sections: [
          { label: "", answer: "The iron scepter with which to rule all nations" }
        ]
      },
      {
        number: 10,
        question: "Write Rv 22:18-19.",
        points: "[8 points]",
        sections: [
          { label: "", answer: "I warn everyone who hears the words of the prophecy of this book: If anyone adds anything to them, God will add to him the plagues described in this book. And if anyone takes words away from this book of prophecy, God will take away from him his share in the tree of life and in the holy city, which are described in this book." }
        ]
      }
    ];

    let userAnswers = {};

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      questions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const header = document.createElement('div');
        header.className = 'question-header';
        header.innerHTML = `
          <div class="question-number">Question ${q.number}</div>
          <div class="question-points">${q.points}</div>
        `;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';
        questionText.textContent = q.question;

        const answerSection = document.createElement('div');
        answerSection.className = 'answer-section';

        q.sections.forEach((section, sIndex) => {
          const sectionDiv = document.createElement('div');
          sectionDiv.className = 'answer-subsection';
          
          if (section.label) {
            const label = document.createElement('div');
            label.className = 'subsection-label';
            label.textContent = section.label;
            sectionDiv.appendChild(label);
          }

          const textarea = document.createElement('textarea');
          textarea.className = 'answer-textarea';
          textarea.id = `q${qIndex}-s${sIndex}`;
          textarea.dataset.answer = section.answer;
          textarea.dataset.question = qIndex;
          textarea.dataset.section = sIndex;
          textarea.rows = 3;

          sectionDiv.appendChild(textarea);
          answerSection.appendChild(sectionDiv);
        });

        card.appendChild(header);
        card.appendChild(questionText);
        card.appendChild(answerSection);
        container.appendChild(card);
      });

      document.querySelectorAll('.answer-textarea').forEach(textarea => {
        textarea.addEventListener('input', function() {
          this.classList.remove('correct', 'incorrect', 'revealed');
          const feedbackDiv = this.nextElementSibling;
          if (feedbackDiv && feedbackDiv.classList.contains('feedback-message')) {
            feedbackDiv.remove();
          }
        });
      });
    }

    function normalizeAnswer(answer) {
      return answer.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[^\w\s:]/g, '');
    }

    function calculateSimilarity(str1, str2) {
      const s1 = normalizeAnswer(str1);
      const s2 = normalizeAnswer(str2);
      
      if (s1 === s2) return 100;
      
      const words1 = s1.split(' ');
      const words2 = s2.split(' ');
      
      let matchingWords = 0;
      words1.forEach(word => {
        if (words2.includes(word) && word.length > 2) {
          matchingWords++;
        }
      });
      
      const maxWords = Math.max(words1.length, words2.length);
      return maxWords > 0 ? Math.round((matchingWords / maxWords) * 100) : 0;
    }

    document.getElementById('check-btn').addEventListener('click', function() {
      let totalScore = 0;
      let maxScore = 0;

      questions.forEach((q, qIndex) => {
        const questionPoints = parseInt(q.points.match(/\d+/)[0]);
        const sectionsCount = q.sections.length;
        const pointsPerSection = questionPoints / sectionsCount;

        q.sections.forEach((section, sIndex) => {
          const textarea = document.getElementById(`q${qIndex}-s${sIndex}`);
          if (!textarea || textarea.classList.contains('revealed')) return;

          const userAnswer = textarea.value.trim();
          const correctAnswer = section.answer;
          
          maxScore += pointsPerSection;

          const existingFeedback = textarea.nextElementSibling;
          if (existingFeedback && existingFeedback.classList.contains('feedback-message')) {
            existingFeedback.remove();
          }

          if (userAnswer === '') {
            textarea.classList.remove('correct', 'incorrect');
            textarea.style.borderColor = '';
            return;
          }

          const similarity = calculateSimilarity(userAnswer, correctAnswer);
          
          const feedbackDiv = document.createElement('div');
          feedbackDiv.className = 'feedback-message';
          
          if (similarity >= 90) {
            textarea.classList.remove('incorrect');
            textarea.classList.add('correct');
            textarea.style.borderColor = '';
            feedbackDiv.innerHTML = `<span style="color: #10b981; font-weight: bold;">✓ Correct!</span> (${pointsPerSection.toFixed(1)} points)`;
            totalScore += pointsPerSection;
          } else if (similarity >= 60) {
            textarea.classList.remove('correct', 'incorrect');
            textarea.style.borderColor = '#f59e0b';
            const partialPoints = pointsPerSection * (similarity / 100);
            feedbackDiv.innerHTML = `<span style="color: #f59e0b; font-weight: bold;">⚠ Partially Correct</span> (${partialPoints.toFixed(1)}/${pointsPerSection.toFixed(1)} points - ${similarity}% match)`;
            totalScore += partialPoints;
          } else {
            textarea.classList.remove('correct');
            textarea.classList.add('incorrect');
            textarea.style.borderColor = '';
            feedbackDiv.innerHTML = `<span style="color: #ef4444; font-weight: bold;">✗ Incorrect</span> (0/${pointsPerSection.toFixed(1)} points)`;
          }
          
          textarea.parentNode.insertBefore(feedbackDiv, textarea.nextSibling);
        });
      });

      const scoreDisplay = document.getElementById('score-display');
      const scoreText = document.getElementById('score-text');
      const scoreDetails = document.getElementById('score-details');

      const percentage = maxScore > 0 ? Math.round((totalScore / maxScore) * 100) : 0;
      scoreText.textContent = `Score: ${percentage}%`;
      scoreDetails.textContent = `${totalScore.toFixed(1)} out of ${maxScore.toFixed(1)} points`;
      scoreDisplay.classList.add('show');

      scoreDisplay.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    document.getElementById('show-btn').addEventListener('click', function() {
      document.querySelectorAll('.answer-textarea').forEach(textarea => {
        if (!textarea.classList.contains('correct')) {
          textarea.value = textarea.dataset.answer;
          textarea.classList.remove('correct', 'incorrect');
          textarea.classList.add('revealed');
          textarea.style.borderColor = '';
          
          const existingFeedback = textarea.nextElementSibling;
          if (existingFeedback && existingFeedback.classList.contains('feedback-message')) {
            existingFeedback.remove();
          }
        }
      });

      const scoreDisplay = document.getElementById('score-display');
      scoreDisplay.classList.remove('show');
    });

    document.getElementById('reset-btn').addEventListener('click', function() {
      document.querySelectorAll('.answer-textarea').forEach(textarea => {
        textarea.value = '';
        textarea.classList.remove('correct', 'incorrect', 'revealed');
        textarea.style.borderColor = '';
        
        const existingFeedback = textarea.nextElementSibling;
        if (existingFeedback && existingFeedback.classList.contains('feedback-message')) {
          existingFeedback.remove();
        }
      });

      const scoreDisplay = document.getElementById('score-display');
      scoreDisplay.classList.remove('show');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const defaultConfig = {
      quiz_title: "Revelation Fill-in-the-Blanks Quiz",
      check_button: "Check Answers",
      show_button: "Show All Answers",
      reset_button: "Reset Quiz"
    };

    const config = {};

    async function onConfigChange(newConfig) {
      Object.assign(config, newConfig);
      
      document.getElementById('quiz-title').textContent = config.quiz_title || defaultConfig.quiz_title;
      document.getElementById('check-btn').textContent = config.check_button || defaultConfig.check_button;
      document.getElementById('show-btn').textContent = config.show_button || defaultConfig.show_button;
      document.getElementById('reset-btn').textContent = config.reset_button || defaultConfig.reset_button;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig: defaultConfig,
        onConfigChange: onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
          ["check_button", config.check_button || defaultConfig.check_button],
          ["show_button", config.show_button || defaultConfig.show_button],
          ["reset_button", config.reset_button || defaultConfig.reset_button]
        ])
      });
    }
  </script>
