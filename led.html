<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LED Scroller Pro – Fullscreen Digital Marquee</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* avoid accidental text selection on controls */
    }

    body {
      background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
      font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, -apple-system, 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* Main LED sign board container */
    .led-app {
      max-width: 1300px;
      width: 100%;
      background: rgba(10, 20, 28, 0.75);
      backdrop-filter: blur(2px);
      border-radius: 3rem;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      padding: 1.8rem 2rem 2.2rem;
      transition: all 0.2s ease;
    }

    /* when fullscreen active, we style the container differently */
    .led-app:fullscreen {
      max-width: 100%;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      padding: 1rem;
      background: #030b10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    .led-app:fullscreen .led-panel {
      flex: 1 1 auto;
      margin-bottom: 1rem;
    }

    .led-app:fullscreen .controls {
      margin-top: 0.5rem;
      background: rgba(0, 0, 0, 0.75);
    }

    h1 {
      margin: 0 0 0.25rem 0;
      font-size: 2rem;
      font-weight: 600;
      background: linear-gradient(135deg, #e0f2fe, #7dd3fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    h1 small {
      font-size: 0.8rem;
      background: rgba(255,255,240,0.15);
      padding: 4px 12px;
      border-radius: 40px;
      color: #b9e6ff;
      font-weight: normal;
      letter-spacing: normal;
    }

    .sub {
      color: #8ba0ae;
      margin-bottom: 2rem;
      border-left: 3px solid #2dd4bf;
      padding-left: 12px;
      font-size: 0.9rem;
    }

    /* LED PANEL (the actual scroller) */
    .led-panel {
      background: #03070c;
      border-radius: 2rem;
      padding: 1rem;
      box-shadow: inset 0 0 0 2px #2c3e44, 0 20px 35px -10px black, 0 0 0 6px #1e2f38;
      margin-bottom: 2rem;
      transition: all 0.2s;
    }

    .led-screen {
      background-color: #000000;
      border-radius: 1.2rem;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,255,255,0.2), 0 0 0 1px rgba(90,210,255,0.3);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: black;
      cursor: pointer;
      transition: filter 0.2s;
    }

    /* control cockpit */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: space-between;
      align-items: flex-end;
      background: rgba(18, 28, 35, 0.7);
      border-radius: 2rem;
      padding: 1.5rem 1.8rem;
      backdrop-filter: blur(8px);
      margin-top: 0.5rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 130px;
    }

    .control-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9ab3c7;
    }

    input, select, button {
      background: #0f1a1f;
      border: 1px solid #2e4a5c;
      color: #f0f9ff;
      padding: 10px 14px;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus, select:focus, button:focus {
      outline: none;
      border-color: #2dd4bf;
      box-shadow: 0 0 0 2px rgba(45,212,191,0.3);
    }

    input[type="color"] {
      width: 56px;
      height: 48px;
      padding: 4px;
      border-radius: 30px;
      cursor: pointer;
      background: #101e26;
    }

    input[type="range"] {
      -webkit-appearance: none;
      background: #1f343f;
      border-radius: 20px;
      height: 5px;
    }

    input[type="range"]:focus {
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #2dd4bf;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 5px #5eead4;
      border: none;
    }

    button {
      background: #1f3e4c;
      border-color: #3c798e;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover {
      background: #2a596e;
      border-color: #6bc5d9;
      transform: scale(0.98);
    }

    .speed-value, .fontsize-value {
      display: inline-block;
      background: #010a0e;
      padding: 2px 8px;
      border-radius: 40px;
      font-size: 0.7rem;
      margin-left: 8px;
      font-family: monospace;
    }

    .row-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      width: 100%;
    }

    .text-input-group {
      flex: 3;
      min-width: 200px;
    }

    .text-input-group input {
      width: 100%;
      background: #051218;
      border-radius: 60px;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    footer {
      margin-top: 1.8rem;
      text-align: center;
      font-size: 0.7rem;
      color: #4e6b7a;
    }

    /* fullscreen button specific style */
    .fullscreen-btn {
      background: #1f4d5c;
      border-color: #2dd4bf;
      box-shadow: 0 0 6px rgba(45,212,191,0.3);
    }

    .fullscreen-btn:hover {
      background: #2f6f82;
    }

    @media (max-width: 780px) {
      .led-app {
        padding: 1rem;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .control-group {
        width: 100%;
      }
      .action-buttons {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
<div class="led-app" id="ledAppContainer">
  <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;">
    <h1>⚡ LED SCROLLER <small>digital marquee + fullscreen</small></h1>
    <div style="font-size: 0.75rem; background: #00000055; padding: 4px 12px; border-radius: 40px;">✨ real-time LED effect</div>
  </div>
  <div class="sub">Type any message – customize speed, colors & glow – click FULLSCREEN for immersive LED board</div>

  <!-- LED sign display -->
  <div class="led-panel" id="ledPanel">
    <div class="led-screen">
      <canvas id="ledCanvas" width="1000" height="140" style="width:100%; height:auto; aspect-ratio:1000/140"></canvas>
    </div>
  </div>

  <!-- control panel -->
  <div class="controls">
    <div class="text-input-group control-group">
      <label>📝 SCROLL TEXT</label>
      <input type="text" id="messageInput" value="✨ FULLSCREEN MODE ★ CLICK THE STAR BUTTON ★ CUSTOM SPEED & COLOR ✨" autocomplete="off">
    </div>

    <div class="control-group">
      <label>⏩ SPEED <span id="speedVal" class="speed-value">80</span></label>
      <input type="range" id="speedSlider" min="20" max="220" value="80" step="2">
    </div>

    <div class="control-group">
      <label>🎨 LED COLOR</label>
      <input type="color" id="textColorPicker" value="#0ff4ce">
    </div>

    <div class="control-group">
      <label>🌑 BG COLOR</label>
      <input type="color" id="bgColorPicker" value="#000000">
    </div>

    <div class="control-group">
      <label>🔠 FONT SIZE</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="range" id="fontSizeSlider" min="36" max="96" value="68" step="2">
        <span id="fontSizeVal" class="fontsize-value">68px</span>
      </div>
    </div>

    <div class="action-buttons">
      <button id="resetBtn">⟳ RESET DEFAULTS</button>
      <button id="applyBtn">▶️ APPLY / RESTART</button>
      <button id="fullscreenBtn" class="fullscreen-btn">🖥️ FULLSCREEN</button>
    </div>
  </div>
  <footer>
    💡 Real LED simulation • Smooth infinite scroll • Fullscreen mode available • Press ESC to exit fullscreen
  </footer>
</div>

<script>
  (function(){
    // ----- DOM elements -----
    const canvas = document.getElementById('ledCanvas');
    const ctx = canvas.getContext('2d');
    const appContainer = document.getElementById('ledAppContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    
    // text content
    const messageInput = document.getElementById('messageInput');
    // speed
    const speedSlider = document.getElementById('speedSlider');
    const speedValSpan = document.getElementById('speedVal');
    // colors
    const textColorPicker = document.getElementById('textColorPicker');
    const bgColorPicker = document.getElementById('bgColorPicker');
    // font size
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeValSpan = document.getElementById('fontSizeVal');
    // buttons
    const resetBtn = document.getElementById('resetBtn');
    const applyBtn = document.getElementById('applyBtn');
    
    // ---- Animation state ----
    let scrollX = 0;            // current horizontal offset (pixels)
    let textWidth = 0;          // computed width of current text
    let animationId = null;
    let previousFrameTime = null;
    let pixelsPerSecond = 80;    // default speed (pixels/sec)
    let canvasWidth = 1000;
    let canvasHeight = 140;
    
    // configurable drawing props
    let currentText = messageInput.value;
    let textColor = textColorPicker.value;
    let bgColor = bgColorPicker.value;
    let fontSize = parseInt(fontSizeSlider.value, 10);
    
    let isScrollingActive = true;
    let resizeObserver = null;
    
    // Sync UI values to animation variables
    function syncSettingsFromUI() {
      currentText = messageInput.value;
      if (currentText.trim() === "") currentText = "⚡ LED SCROLL ⚡";
      textColor = textColorPicker.value;
      bgColor = bgColorPicker.value;
      fontSize = parseInt(fontSizeSlider.value, 10);
      pixelsPerSecond = parseInt(speedSlider.value, 10);
      speedValSpan.innerText = pixelsPerSecond;
      fontSizeValSpan.innerText = fontSize + "px";
      
      updateTextMetrics();
      // reset scroll only when manually applying, but we also use it on restart
    }
    
    function measureTextWidth() {
      if (!ctx) return 100;
      const fontString = `bold ${fontSize}px 'Monaco', 'Courier New', 'Fira Mono', 'SF Mono', monospace`;
      ctx.font = fontString;
      return ctx.measureText(currentText).width;
    }
    
    function updateTextMetrics() {
      const fontString = `bold ${fontSize}px 'Monaco', 'Courier New', 'Fira Mono', 'SF Mono', monospace`;
      ctx.font = fontString;
      textWidth = ctx.measureText(currentText).width;
      if (textWidth < 10) textWidth = 200;
    }
    
    // Draw LED style with matrix texture + glow
    function drawLEDScene() {
      if (!ctx) return;
      
      // maintain logical 1000px width for consistency, but canvas CSS scales perfectly
      canvas.width = 1000;
      canvas.height = 140;
      canvasWidth = 1000;
      canvasHeight = 140;
      
      // 1) background
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      
      // subtle LED matrix dots (added realism)
      ctx.fillStyle = `${bgColor === '#000000' ? '#0a141c' : bgColor}`;
      for (let i = 0; i < canvasWidth; i += 14) {
        for (let j = 0; j < canvasHeight; j += 14) {
          ctx.fillStyle = `rgba(255,255,210,0.04)`;
          ctx.fillRect(i, j, 2, 2);
        }
      }
      
      const fontString = `bold ${fontSize}px 'Monaco', 'Courier New', 'Fira Mono', 'SF Mono', monospace`;
      ctx.font = fontString;
      ctx.shadowBlur = 0;
      const xPos = scrollX;
      const spacing = 55; // gap between copies for smooth loop
      
      ctx.shadowColor = textColor;
      ctx.shadowBlur = 12;
      ctx.fillStyle = textColor;
      
      // draw primary text
      ctx.fillText(currentText, xPos, canvasHeight/2 + fontSize*0.35);
      
      // second copy (right side) if needed
      if (xPos + textWidth + spacing < canvasWidth) {
        ctx.fillText(currentText, xPos + textWidth + spacing, canvasHeight/2 + fontSize*0.35);
      }
      // third copy for very wide loops (ensures no gap on fast scroll)
      if (xPos + 2*(textWidth + spacing) < canvasWidth) {
        ctx.fillText(currentText, xPos + 2*(textWidth + spacing), canvasHeight/2 + fontSize*0.35);
      }
      // extra left copy for negative offset situations
      if (xPos < 0 && (xPos + textWidth) > 0) {
        // already visible part
      }
      if (xPos + textWidth < 0) {
        ctx.fillText(currentText, xPos + textWidth + spacing, canvasHeight/2 + fontSize*0.35);
      }
      
      ctx.shadowBlur = 0;
      // add glass edge reflection
      ctx.strokeStyle = "rgba(255,255,245,0.12)";
      ctx.lineWidth = 2;
      ctx.strokeRect(4, 4, canvasWidth-8, canvasHeight-8);
      
      // LED sparkling flair
      ctx.fillStyle = textColor + "22";
      for (let k = 0; k < 70; k++) {
        let fx = (scrollX * 0.25 + k * 19) % canvasWidth;
        let fy = (k * 9) % canvasHeight;
        ctx.beginPath();
        ctx.arc(fx, fy, 1.1, 0, Math.PI*2);
        ctx.fill();
      }
    }
    
    // Animation loop (delta time)
    function animateScroll(nowMs) {
      if (!isScrollingActive) return;
      if (!previousFrameTime) {
        previousFrameTime = nowMs;
        requestAnimationFrame(animateScroll);
        drawLEDScene();
        return;
      }
      
      let deltaMs = Math.min(100, nowMs - previousFrameTime);
      if (deltaMs > 0) {
        let deltaSec = deltaMs / 1000;
        let step = pixelsPerSecond * deltaSec;
        scrollX -= step;
        
        // reset for infinite seamless loop: when text moves beyond left side fully
        if (scrollX <= -(textWidth + 100)) {
          scrollX = canvasWidth;
        }
        if (scrollX < -textWidth * 2) scrollX = canvasWidth;
      }
      previousFrameTime = nowMs;
      drawLEDScene();
      animationId = requestAnimationFrame(animateScroll);
    }
    
    function startAnimation() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      previousFrameTime = null;
      isScrollingActive = true;
      updateTextMetrics();
      drawLEDScene();
      animationId = requestAnimationFrame(animateScroll);
    }
    
    function restartAnimationWithNewSettings(resetScrollPosition = true) {
      syncSettingsFromUI();
      if (resetScrollPosition) {
        scrollX = canvasWidth;
      }
      updateTextMetrics();
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      previousFrameTime = null;
      isScrollingActive = true;
      drawLEDScene();
      animationId = requestAnimationFrame(animateScroll);
    }
    
    // handle canvas size changes due to fullscreen / resize
    function refreshCanvasDimensions() {
      canvas.width = 1000;
      canvas.height = 140;
      canvasWidth = 1000;
      canvasHeight = 140;
      updateTextMetrics();
      if (scrollX > canvasWidth) scrollX = canvasWidth;
      drawLEDScene();
    }
    
    // Fullscreen handling
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        // request fullscreen on the main app container
        appContainer.requestFullscreen().catch(err => {
          console.warn(`Fullscreen error: ${err.message}`);
        }).then(() => {
          // after fullscreen, we keep canvas logical size but css adapts, we refresh drawing once
          setTimeout(() => {
            refreshCanvasDimensions();
            drawLEDScene();
          }, 50);
        });
      } else {
        document.exitFullscreen().then(() => {
          refreshCanvasDimensions();
          drawLEDScene();
        });
      }
    }
    
    // Listen to fullscreen change events to redraw correctly
    document.addEventListener('fullscreenchange', () => {
      // slight delay to allow CSS adjustments
      setTimeout(() => {
        refreshCanvasDimensions();
        drawLEDScene();
      }, 100);
    });
    
    // Event listeners for UI changes
    function onChangeRestart() {
      restartAnimationWithNewSettings(true);
    }
    
    messageInput.addEventListener('input', () => {
      restartAnimationWithNewSettings(true);
    });
    
    speedSlider.addEventListener('input', (e) => {
      pixelsPerSecond = parseInt(e.target.value, 10);
      speedValSpan.innerText = pixelsPerSecond;
      // speed updated live, no restart needed
    });
    
    textColorPicker.addEventListener('input', (e) => {
      textColor = e.target.value;
      drawLEDScene();
    });
    
    bgColorPicker.addEventListener('input', (e) => {
      bgColor = e.target.value;
      drawLEDScene();
    });
    
    fontSizeSlider.addEventListener('input', (e) => {
      fontSize = parseInt(e.target.value, 10);
      fontSizeValSpan.innerText = fontSize + "px";
      updateTextMetrics();
      // reset scroll to avoid visual cut-off, better UX
      scrollX = canvasWidth;
      drawLEDScene();
    });
    
    applyBtn.addEventListener('click', () => {
      restartAnimationWithNewSettings(true);
    });
    
    resetBtn.addEventListener('click', () => {
      messageInput.value = "⭐ FULLSCREEN READY  •  CUSTOM LED COLORS  •  SMOOTH INFINITE SCROLL ⭐";
      speedSlider.value = "80";
      pixelsPerSecond = 80;
      speedValSpan.innerText = "80";
      textColorPicker.value = "#0ff4ce";
      bgColorPicker.value = "#000000";
      fontSizeSlider.value = "68";
      fontSize = 68;
      fontSizeValSpan.innerText = "68px";
      textColor = "#0ff4ce";
      bgColor = "#000000";
      currentText = messageInput.value;
      updateTextMetrics();
      scrollX = canvasWidth;
      restartAnimationWithNewSettings(true);
    });
    
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    
    // ensure smooth canvas on window resize or orientation change
    window.addEventListener('resize', () => {
      refreshCanvasDimensions();
      drawLEDScene();
    });
    
    // initial setup
    function init() {
      canvas.width = 1000;
      canvas.height = 140;
      canvasWidth = 1000;
      canvasHeight = 140;
      syncSettingsFromUI();
      scrollX = canvasWidth;
      updateTextMetrics();
      startAnimation();
    }
    
    init();
  })();
</script>
</body>
</html>
